<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Miguel">
    <meta name="keywords" content="HTML, CSS, JavaScript, C++, Arduino, IoT, Smart Home">
    <meta name="description" content="An implmentation of IoT on a house">

    <title>Smart Home Monitoring</title>
    <link rel="shortcut icon" href="/img/energy-monitoring.ico" type="image/x-icon">

    <link rel="stylesheet" href="/app/index.css">
</head>

<body>
    <main class="dashboard_wrapper">
        <section class="dashboard-card dashboard-card--temp">
            <span class="dashboard-card__header">Temperature</span>
            <span class="dashboard-card__value" id="temp-value">22.00°C</span>
        </section>
        <section class="dashboard-card dashboard-card--humid">
            <span class="dashboard-card__header">Humidity</span>
            <span class="dashboard-card__value" id="humid-value">35.00%</span>
        </section>
        <section class="dashboard-card dashboard-card--chart">
            <span id="chart"></span>
        </section>
        <section class="dashboard-card dashboard-card--rain">
            <span class="dashboard-card__header">Raindrop</span>
            <span class="dashboard-card__value" id="rain-value">RAIN</span>
        </section>
        <section class="dashboard-card dashboard-card--gas">
            <span class="dashboard-card__header">Gas Value</span>
            <span class="dashboard-card__value" id="gas-value">552 ppm</span>
        </section>
        <section class="dashboard-card dashboard-card--led">
            <span class="dashboard-card__header">LEDs</span>
            <div class="dashboard-card__led-control">
                <button class="led-button led-button--red">
                    <div class="led-button__indicator"></div>
                    Red
                </button>
                <button class="led-button led-button--green">
                    <div class="led-button__indicator"></div>
                    Green
                </button>
                <button class="led-button led-button--blue">
                    <div class="led-button__indicator"></div>
                    Blue
                </button>
            </div>
        </section>
    </main>
</body>

</html>
